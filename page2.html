<!DOCTYPE html>
<html>
<head>
<title>Secret 😏</title>
<style>
body{
  height:100vh;
  margin:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:#ffe6f0;
  overflow:hidden;
}

button{
  padding:15px;
  border:none;
  border-radius:20px;
  margin:10px;
}

#run1, #run2{
  position:absolute;
}
</style>
</head>

<body>

<h2>amma kiyanna deyak thiyanawa 😏</h2>

<button onclick="next()">kiyanna pana ❤️</button>
<button id="run1">one na 💔</button>
<button id="run2">one na 😏</button>

<script>
function move(btn){
  btn.style.left=Math.random()*window.innerWidth+"px";
  btn.style.top=Math.random()*window.innerHeight+"px";
}

setInterval(()=>{
  move(document.getElementById("run1"));
  move(document.getElementById("run2"));
},300);

function next(){
  window.location.href="final.html";
}
</script>

</body>
</html>
